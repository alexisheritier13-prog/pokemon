<!doctype html>
<html lang="fr">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f6efdf;
      font-family: Arial, Helvetica, sans-serif;
      color: #1b2a4a;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #fffbf2;
        border: 3px solid #1b2a4a;
        border-radius: 24px;
      "
    >
      <tr>
        <td style="padding: 28px 24px">
          <h1 style="margin: 0 0 12px; font-size: 24px">Ton code de connexion</h1>
          <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.5">
            Tape ce code dans l'app pour te connecter :
          </p>
          <p
            style="
              margin: 0 0 24px;
              font-size: 34px;
              font-weight: bold;
              letter-spacing: 8px;
              text-align: center;
              background: #ede2c8;
              border-radius: 16px;
              padding: 14px 0;
            "
          >
            {{ .Token }}
          </p>
          <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.5">
            Ou ouvre directement ce lien :
          </p>
          <p style="margin: 0 0 24px; text-align: center">
            <a
              href="{{ .ConfirmationURL }}"
              style="
                display: inline-block;
                background: #d63a28;
                color: #ffffff;
                text-decoration: none;
                font-weight: bold;
                padding: 14px 22px;
                border-radius: 18px;
                border: 3px solid #1b2a4a;
              "
              >Me connecter</a
            >
          </p>
          <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #4a5876">
            Le code et le lien expirent dans une heure. Si tu n'as rien demandé, ignore simplement
            cet e-mail.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
