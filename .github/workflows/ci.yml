name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - run: npm run size

  integration:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Local Supabase stack (Docker is available on GitHub runners); unused services skipped.
      - run: npx supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime
      - name: Generated types are up to date
        run: npm run db:types && git diff --exit-code src/types/database.ts
      - run: npm run test:int
